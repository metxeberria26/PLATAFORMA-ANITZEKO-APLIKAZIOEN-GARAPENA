
<!DOCTYPE html>
<html>
<head>
    <title>Nire web orria</title>

    <style>
        body {
            margin: 0;
            font-family: "Times New Roman";
        }

        .goiburua {
            background-color: #e0fac0;
            border: 2px solid #4cdf60;
            border-radius: 13px;
            height: 90px;
            margin: 6px 4px 20px 4px;

            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .erdia {
            display: flex;
            gap: 21px;
            margin: 0 4px 30px 4px;
        }

        .menua {
            background-color: #f85757;
            border: 2px solid #56e769;
            border-radius: 13px;
            width: 235px;
            height: 496px;

            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 25px;
            font-size: 23px;
        }

        .zerrenda {
            background-color: #d4f7a9;
            border: 2px solid #4deb62;
            border-radius: 13px;
            flex: 1;
            height: 496px;
            padding: 0 18px;

            text-align: center;
            font-size: 20px;
        }

        .lerroak {
            margin-top: 20px;
        }

        .lerroa {
            background-color: #76a2b6;
            border-radius: 16px;
            height: 122px;
            margin-bottom: 20px;

            text-align: left;
            padding-left: 23px;
            padding-top: 5px;
            font-size: 19px;
        }

        .oina {
            background-color: #ddf3c3;
            border: 2px solid #4eed63;
            border-radius: 13px;
            height: 70px;
            margin: 0 4px 6px 4px;

            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <div class="goiburua">
        Goiburua
    </div>

    <div class="erdia">

        <div class="menua">
            Menua
        </div>

        <div class="zerrenda">
            <p>Zerrenda</p>

            <div class="lerroak">

                <div class="lerroa">
                    <p>1.Lerroa</p>
                </div>

                <div class="lerroa">
                    <p>2.Lerroa</p>
                </div>

                <div class="lerroa">
                    <p>3.Lerroa</p>
                </div>

            </div>
        </div>

    </div>

    <div class="oina">
        Oina
    </div>

</body>
</html>
